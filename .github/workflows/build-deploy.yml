name: Build and Deploy User Service

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'go.mod'
      - 'Dockerfile'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}
          token_format: 'access_token'
          access_token_lifetime: '600s'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/telecom-dev-123/telecom-registry/user-service:${{ github.sha }} .
          docker tag us-central1-docker.pkg.dev/telecom-dev-123/telecom-registry/user-service:${{ github.sha }} us-central1-docker.pkg.dev/telecom-dev-123/telecom-registry/user-service:latest

      - name: Push to Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/telecom-dev-123/telecom-registry/user-service:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/telecom-dev-123/telecom-registry/user-service:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy user-service \
            --image us-central1-docker.pkg.dev/telecom-dev-123/telecom-registry/user-service:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080

      - name: Post Deployment Summary
        run: |
          echo "### User Service Build & Deploy" >> $GITHUB_STEP_SUMMARY
          echo "✅ Built and deployed to Cloud Run" >> $GITHUB_STEP_SUMMARY
          echo "Image: user-service:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
